# The board store Worker (#C719). Deployed under its OWN name while the old board keeps running; at cut-over the connector
# address moves to it (the old state Worker's name and address are kept only if that can be done without a gap).
# No secrets and no addresses here: the account's D1 id is filled in after `wrangler d1 create`, and the public hostname is
# passed on the deploy command line (--routes), so nothing about the owner's domain is committed.
name = "flight-board-store"
main = "board-entry.mjs"
compatibility_date = "2025-09-01"
workers_dev = false

[[d1_databases]]
binding = "DB"
database_name = "flight-board-store"
database_id = "5142af62-65b4-4f57-8078-ac83d7214251"
migrations_dir = "migrations"

# Files and screenshots (#C726 C1): the bytes; the list is D1's files table (migration 0010). Created once before the first
# deploy with this binding: `npx wrangler r2 bucket create flight-board-files`.
[[r2_buckets]]
binding = "FILES"
bucket_name = "flight-board-files"

# The old board page and its fonts (#C723), built by `node scripts/build-store-page.mjs <board.config.json>` into
# worker/store-assets/ (git-ignored but for its .assetsignore, so the folder exists in every checkout and a deploy without
# the page still works: / then says "not built"). Every request runs the Worker first, so the page and the fonts are
# served only after its Access check, never straight from the assets. Paths are exact (no /board.html -> /board redirect).
[assets]
directory = "store-assets"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"

[vars]
BOARD_VERSION = ""
# #C737: the commit the Worker was deployed from; the pair's deploy sets it (wrangler deploy --var BUILD_SHA:<signed commit>).
BUILD_SHA = ""
